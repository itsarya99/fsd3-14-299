
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - GoggleHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        header {
            background-color: #111827;
            color: white;
            padding: 20px 60px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .form-container {
            max-width: 650px;
            margin: 60px auto;
            background-color: white;
            padding: 45px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .form-container h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .form-container > p {
            text-align: center;
            margin-bottom: 30px;
            color: #555;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;

            background-color: #2563eb;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        footer {
            background-color: #111827;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 80px;
        }
    </style>
</head>

<body>

    <header>

        <h1>GoggleHub</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Goggles</a>
            <a href="about.html">About Us</a>
            <a href="enquiry.html">Enquiry</a>
        </nav>

    </header>


    <div class="form-container">

        <h2>Make an Enquiry</h2>

        <p>
            Have a question? Fill out the form and we'll get back to you.
        </p>


        <form>

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
            >


            <label for="product">Select Product</label>

            <select id="product" name="product">

                <option value="">Choose a product</option>
                <option value="classic">Classic Black Goggles</option>
                <option value="premium">Premium Style Goggles</option>
                <option value="designer">Designer Goggles</option>

            </select>


            <label for="message">Your Enquiry</label>

            <textarea
                id="message"
                name="message"
                placeholder="Write your enquiry here..."
                required
            ></textarea>


            <button type="submit">
                Submit Enquiry
            </button>

        </form>

    </div>


    <footer>

        <p>© 2026 GoggleHub. All Rights Reserved.</p>

    </footer>

</body>

</html>
